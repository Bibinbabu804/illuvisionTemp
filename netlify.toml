# Static export: Netlify just builds and publishes the /out folder.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  # This is a plain static site (next.config: output "export"). Stop Netlify
  # auto-installing its Next.js server plugin, which ignores /out and 404s.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  # Set the real domain in Netlify → Site settings → Environment variables
  # (used for canonical URLs, sitemap and Open Graph):
  # NEXT_PUBLIC_SITE_URL = "https://your-domain.com"

# Long-lived caching for fingerprinted Next.js assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
